body[data-theme="dark"][data-mode="short"]{--accent:#3cc78f;--glow:rgba(60,199,143,.25)}

html,body{height:100%}
body{

  background:var(--bg);color:var(--text);

  transition:background .3s,color .3s;
  -webkit-font-smoothing:antialiased;
}
.app{width:100%;max-width:460px;padding:22px 18px 34px}
header.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{font-size:18px;font-weight:700;letter-spacing:.5px}
.top-actions{display:flex;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:16px;cursor:pointer;display:grid;place-items:center;transition:transform .15s,box-shadow .15s}
.icon-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:4px;margin-bottom:16px}
.tab{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 0;border-radius:999px;font-size:14px;cursor:pointer;transition:all .2s;font-family:inherit}
.tab.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 4px 14px var(--glow)}
.card,.timer-card{background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow)}
.timer-card{padding:34px 24px 26px;display:flex;flex-direction:column;align-items:center}
.ring-wrap{position:relative;width:280px;height:280px;max-width:78vw;aspect-ratio:1}
.ring{width:100%;height:100%;display:block}
.ring-bg{fill:none;stroke:var(--border);stroke-width:12}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px}
.time{font-size:60px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1}
.status{font-size:13px;color:var(--muted)}
.dots{display:flex;gap:7px;margin-top:22px}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--accent);opacity:.45}
.dot.on{background:var(--accent);opacity:1}
.cycle-info{margin-top:10px;font-size:12.5px;color:var(--muted)}
.controls{display:flex;gap:10px;margin-top:22px;align-items:center}
.btn{font-family:inherit;border:0;cursor:pointer;border-radius:999px;transition:transform .15s,box-shadow .15s,background .2s,color .2s;font-weight:600}
.btn-primary{background:var(--accent);color:#fff;padding:13px 42px;font-size:16px;box-shadow:0 8px 22px var(--glow)}

.btn-primary:active{transform:translateY(0)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);padding:12px 22px;font-size:14px}

.tasks{margin-top:16px;padding:20px}
.tasks-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}

.hint{font-size:11.5px;color:var(--muted)}
.task-add{display:flex;gap:8px;margin-bottom:8px}

.empty{color:var(--muted);font-size:13px;text-align:center;padding:14px 0}
.stats{display:flex;justify-content:space-between;margin-top:16px;font-size:12.5px;color:var(--muted);padding:0 4px;gap:8px;flex-wrap:wrap}

.modal-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;width:min(400px,100%);max-height:86vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.25)}

.modal-actions{display:flex;gap:8px;margin-top:16px;align-items:center}

.app{position:relative;z-index:1}

.quote-add .q-author{width:90px}
.empty-tip{color:var(--muted);font-size:12.5px;padding:8px 0}

      <button data-page-node-id="wgUb2AB9N77fo0WMbWuKEe" class="btn btn-primary btn-sm" id="saveBtn" type="button"><!--pnid:gSVdRS7J0FSXiWNNuUREox-->保存</button>

<script data-page-node-id="1Sz2gd2DICg8THKeAVAmPc" data-pnid-children="br5EACtrv9TYUlZMGgjIlr">
(function(){
"use strict";
var $ = function(s){ return document.querySelector(s); };
var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };
function pad(n){ return String(n).padStart(2,"0"); }
function clamp(v,a,b){ return Math.min(b, Math.max(a, v)); }
function today(){ var d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }

var LS = {
  get: function(k,d){ try{ var v = JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } },
  set: function(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

var DEFAULT_SETTINGS = { focus:25, short:5, long:15, cycles:4, autoStart:false, sound:true, notify:false };
var settings = Object.assign({}, DEFAULT_SETTINGS, LS.get("pm_settings", {}));
var tasks = LS.get("pm_tasks", []);
var stats = LS.get("pm_stats", null) || { date:today(), todayCount:0, todaySec:0, totalCount:0, totalSec:0 };
if (stats.date !== today()){ stats.date = today(); stats.todayCount = 0; stats.todaySec = 0; LS.set("pm_stats", stats); }

var MODE_LABEL = { focus:"专注", short:"短休息", long:"长休息" };
var MODE_TIP = { focus:"保持专注，别被干扰", short:"喝口水，活动一下", long:"起来走走，远眺放松" };

var mode = "focus";
var running = false;
var endAt = 0;
var remain = settings.focus * 60000;
var timer = null;
var cycleCount = 0;
var activeTaskId = LS.get("pm_active_task", null);

var timeEl = $("#time"), statusEl = $("#status"), ring = $("#ring"), dotsEl = $("#dots");
var cycleInfoEl = $("#cycleInfo"), startBtn = $("#startBtn"), themeBtn = $("#themeBtn");
var taskInput = $("#taskInput"), taskList = $("#taskList"), modal = $("#modal");

var R = 126, CIRC = 2 * Math.PI * R;
ring.style.strokeDasharray = CIRC;
ring.style.strokeDashoffset = 0;

function total(){ return settings[mode] * 60000; }

/* ---------- 计时核心 ---------- */
function start(){
  if (running) return;
  if (remain <= 0) remain = total();
  endAt = Date.now() + remain;
  running = true;
  timer = setInterval(tick, 200);
  render();
}
function pause(){
  if (!running) return;
  remain = Math.max(0, endAt - Date.now());
  running = false;
  clearInterval(timer); timer = null;
  render();
}
function toggle(){ if (running) pause(); else start(); }
function reset(){ pause(); remain = total(); render(); }
function tick(){
  remain = endAt - Date.now();
  if (remain <= 0){ remain = 0; complete(); return; }
  render();
}
function complete(){
  running = false;
  clearInterval(timer); timer = null;
  remain = 0;
  render();
  if (mode === "focus"){
    cycleCount++;
    stats.todayCount++; stats.totalCount++;
    stats.todaySec += settings.focus * 60; stats.totalSec += settings.focus * 60;
    LS.set("pm_stats", stats);
    var t = null;
    for (var i=0;i<tasks.length;i++){ if (tasks[i].id === activeTaskId){ t = tasks[i]; break; } }
    if (t){ t.pomos++; saveTasks(); renderTasks(); }
    var toLong = (cycleCount % settings.cycles === 0);
    notify("茉莉花猪の番茄钟", toLong ? "太棒了！完成本轮最后一个番茄，进入长休息吧" : "完成一个番茄，休息一下吧");
    if (toLong) switchMode("long", settings.autoStart);
    else switchMode("short", settings.autoStart);
  } else {
    notify("茉莉花猪の番茄钟", "休息结束，开始新的专注吧");
    if (mode === "long") cycleCount = 0;
    switchMode("focus", settings.autoStart);
  }
  playChime();
}
function skip(){
  var done = cycleCount % settings.cycles;
  var next = mode === "focus" ? (done + 1 >= settings.cycles ? "long" : "short") : "focus";
  switchMode(next, false);
}
function switchMode(m, autostart){
  pause();
  mode = m;
  remain = total();
  document.body.dataset.mode = m;
  $$(".tab").forEach(function(b){ b.classList.toggle("active", b.dataset.mode === m); });
  renderQuote();
  if (autostart) start(); else render();
}

/* ---------- 渲染 ---------- */
function render(){
  var secs = Math.max(0, Math.floor(remain / 1000));
  var t = pad(Math.floor(secs / 60)) + ":" + pad(secs % 60);
  timeEl.textContent = t;
  var frac = total() > 0 ? remain / total() : 0;
  ring.style.strokeDashoffset = CIRC * frac;
  var status;
  if (running) status = MODE_TIP[mode];
  else if (remain <= 0) status = "时间到";
  else if (remain < total()) status = "已暂停";
  else status = "准备开始";
  statusEl.textContent = status;
  startBtn.textContent = running ? "暂停" : (remain < total() ? "继续" : "开始");
  document.title = running ? (t + " · " + MODE_LABEL[mode] + " - 茉莉花猪の番茄钟") : "茉莉花猪の番茄钟";
  renderDots();
  renderStats();
}
function renderDots(){
  var n = settings.cycles, done = cycleCount % n;
  dotsEl.innerHTML = "";
  for (var i=0;i<n;i++){
    var d = document.createElement("span");
    d.className = "dot" + (i < done ? " on" : "");
    dotsEl.appendChild(d);
  }
  cycleInfoEl.textContent = "本轮已完成 " + done + " 个 · 再完成 " + (n - done) + " 个进入长休息";
}
function renderStats(){
  $("#statToday").textContent = stats.todayCount;
  $("#statTodayMin").textContent = Math.round(stats.todaySec / 60);
  $("#statTotal").textContent = stats.totalCount;
}

/* ---------- 任务 ---------- */
function saveTasks(){ LS.set("pm_tasks", tasks); LS.set("pm_active_task", activeTaskId); }
function renderTasks(){
  taskList.innerHTML = "";
  if (!tasks.length){
    var li = document.createElement("li");
    li.className = "empty";
    li.textContent = "还没有任务，添加一个开始吧";
    taskList.appendChild(li);
    return;
  }
  tasks.forEach(function(t){
    var li = document.createElement("li");
    li.className = "task" + (t.done ? " done" : "") + (t.id === activeTaskId ? " active" : "");
    var cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = t.done;
    cb.onchange = function(){ t.done = cb.checked; saveTasks(); renderTasks(); };
    var title = document.createElement("span");
    title.className = "task-title";
    title.textContent = t.title;
    title.onclick = function(){
      activeTaskId = (activeTaskId === t.id) ? null : t.id;
      saveTasks(); renderTasks();
    };
    var badge = document.createElement("span");
    badge.className = "pomos";
    badge.textContent = "🍅 " + t.pomos;
    var del = document.createElement("button");
    del.type = "button"; del.className = "del"; del.textContent = "×"; del.title = "删除";
    del.onclick = function(){
      tasks = tasks.filter(function(x){ return x.id !== t.id; });
      if (activeTaskId === t.id) activeTaskId = null;
      saveTasks(); renderTasks();
    };
    li.appendChild(cb); li.appendChild(title); li.appendChild(badge); li.appendChild(del);
    taskList.appendChild(li);
  });
}
$("#addBtn").onclick = function(){
  var v = taskInput.value.trim();
  if (!v) return;
  tasks.push({ id: Date.now(), title: v, done:false, pomos:0 });
  taskInput.value = "";
  saveTasks(); renderTasks(); taskInput.focus();
};
taskInput.addEventListener("keydown", function(e){ if (e.key === "Enter") $("#addBtn").click(); });

/* ---------- 提示音与通知 ---------- */
var audioCtx = null;
function playChime(){
  if (!settings.sound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    var t0 = audioCtx.currentTime;
    var notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach(function(f, i){
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = f;
      var t = t0 + i * 0.16;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.28, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.85);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.9);
    });
  }catch(e){}
}
function notify(title, body){
  if (!settings.notify || !("Notification" in window)) return;
  if (Notification.permission === "granted"){
    try{ new Notification(title, { body: body }); }catch(e){}
  } else if (Notification.permission !== "denied"){
    Notification.requestPermission();
  }
}

/* ---------- 主题 ---------- */
var theme = LS.get("pm_theme", null);
function applyTheme(){
  var dark = theme === "dark" || (theme === null && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.body.dataset.theme = dark ? "dark" : "light";
  themeBtn.textContent = dark ? "☀️" : "🌙";
}
themeBtn.onclick = function(){
  theme = (document.body.dataset.theme === "dark") ? "light" : "dark";
  LS.set("pm_theme", theme);
  applyTheme();
};

/* ---------- 自定义背景 ---------- */
var PRESETS = [
  { name:"晨曦", css:"linear-gradient(135deg,#ffd7a0,#ff9a8b 55%,#ff6a88)" },
  { name:"森林", css:"linear-gradient(160deg,#0ba360,#3cba92)" },
  { name:"星空", css:"linear-gradient(180deg,#141e30,#243b55)" },
  { name:"薰衣草", css:"linear-gradient(135deg,#a18cd1,#fbc2eb)" },
  { name:"海盐", css:"linear-gradient(135deg,#43cea2,#185a9d)" },
  { name:"绿野", css:"url(\"https://workbuddy-space-static.codebuddy.work/image/qKEy41janT363f1V6fk9ee.jpg\") center/cover no-repeat" },
  { name:"晴空", css:"url(\"https://workbuddy-space-static.codebuddy.work/image/MAV3cSLqoKhGe7DOpTMzkA.jpg\") center/cover no-repeat" }
];
var bg = LS.get("pm_bg", null) || { type:"none", value:"" };
function applyBg(){
  var layer = $("#bgLayer");
  if (bg.type === "none" || !bg.value){
    layer.style.display = "none";
    document.body.removeAttribute("data-bg");
    return;
  }
  var css = (bg.type === "preset") ? bg.value
    : ("#000 url(\"" + String(bg.value).replace(/["\\]/g, "\\$&") + "\") center/cover no-repeat");
  layer.style.background = css;
  layer.style.display = "block";
  var isImg = (bg.type === "url" || bg.type === "file" || (bg.type === "preset" && /^url\(/.test(bg.value)));
  document.body.dataset.bg = isImg ? "image" : "preset";
}
function presetIndex(){
  if (bg.type !== "preset") return -1;
  for (var i=0;i<PRESETS.length;i++){ if (PRESETS[i].css === bg.value) return i; }
  return -1;
}
function markPresetSel(){
  var idx = presetIndex();
  $$("#presetRow .preset").forEach(function(b, i){ b.classList.toggle("sel", i === idx); });
}
function renderPresets(){
  var row = $("#presetRow");
  PRESETS.forEach(function(p){
    var b = document.createElement("button");
    b.type = "button"; b.className = "preset"; b.title = p.name;
    b.style.background = p.css;
    b.onclick = function(){
      bg = { type:"preset", value:p.css };
      LS.set("pm_bg", bg); applyBg(); markPresetSel();
    };
    row.appendChild(b);
  });
}
$("#applyBgUrlBtn").onclick = function(){
  var v = $("#bgUrlInput").value.trim();
  bg = v ? { type:"url", value:v } : { type:"none", value:"" };
  LS.set("pm_bg", bg); applyBg(); markPresetSel();
};
$("#bgUrlInput").addEventListener("keydown", function(e){ if (e.key === "Enter") $("#applyBgUrlBtn").click(); });
$("#resetBgBtn").onclick = function(){
  bg = { type:"none", value:"" };
  LS.set("pm_bg", bg);
  $("#bgUrlInput").value = "";
  applyBg(); markPresetSel();
};
$("#bgFileInput").addEventListener("change", function(){
  var file = this.files && this.files[0];
  this.value = "";
  if (!file || file.type.indexOf("image/") !== 0) return;
  var reader = new FileReader();
  reader.onload = function(){
    var src = reader.result;
    var img = new Image();
    img.onload = function(){
      try{
        var max = 1600, w = img.width, h = img.height;
        var scale = Math.min(1, max / Math.max(w, h));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(w * scale));
        c.height = Math.max(1, Math.round(h * scale));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        src = c.toDataURL("image/jpeg", 0.82);
      }catch(e){}
      bg = { type:"file", value:src };
      LS.set("pm_bg", bg);
      applyBg(); markPresetSel();
    };
    img.onerror = function(){
      bg = { type:"file", value:src };
      LS.set("pm_bg", bg);
      applyBg(); markPresetSel();
    };
    img.src = src;
  };
  reader.readAsDataURL(file);
});

/* ---------- 名言 ---------- */
var DEFAULT_QUOTES = [
  { text:"专注当下，未来自来。", author:"" },
  { text:"不积跬步，无以至千里。", author:"荀子" },
  { text:"完成比完美更重要。", author:"" },
  { text:"时间是最公平的裁判。", author:"" },
  { text:"心之所向，身之所往。", author:"" }
];
var quotes = LS.get("pm_quotes", []);
var showQuotes = LS.get("pm_show_quotes", true);
function allQuotes(){ return quotes.length ? quotes : DEFAULT_QUOTES; }
var quoteIdx = -1;
function renderQuote(){
  var bar = $("#quoteBar");
  if (!showQuotes || !allQuotes().length){ bar.style.display = "none"; return; }
  bar.style.display = "block";
  var list = allQuotes(), i;
  do { i = Math.floor(Math.random() * list.length); } while (list.length > 1 && i === quoteIdx);
  quoteIdx = i;
  $("#quoteText").textContent = list[i].text;
  $("#quoteAuthor").textContent = list[i].author ? "—— " + list[i].author : "";
}
setInterval(renderQuote, 30000);
function renderQuoteList(){
  var box = $("#quoteList");
  box.innerHTML = "";
  if (!quotes.length){
    var tip = document.createElement("div");
    tip.className = "empty-tip";
    tip.textContent = "还没有自定义名言，将显示内置名言";
    box.appendChild(tip);
    return;
  }
  quotes.forEach(function(q, idx){
    var row = document.createElement("div");
    row.className = "quote-item";
    var t = document.createElement("span");
    t.className = "qt"; t.textContent = q.text;
    var a = document.createElement("span");
    a.className = "qa"; a.textContent = q.author ? "—— " + q.author : "";
    var del = document.createElement("button");
    del.type = "button"; del.className = "del"; del.textContent = "×"; del.title = "删除";
    del.onclick = function(){
      quotes.splice(idx, 1);
      LS.set("pm_quotes", quotes);
      renderQuoteList(); renderQuote();
    };
    row.appendChild(t); row.appendChild(a); row.appendChild(del);
    box.appendChild(row);
  });
}
$("#addQuoteBtn").onclick = function(){
  var v = $("#quoteInput").value.trim();
  if (!v) return;
  quotes.push({ text:v, author:$("#quoteAuthorInput").value.trim() });
  LS.set("pm_quotes", quotes);
  $("#quoteInput").value = ""; $("#quoteAuthorInput").value = "";
  renderQuoteList(); renderQuote();
  $("#quoteInput").focus();
};
$("#quoteInput").addEventListener("keydown", function(e){ if (e.key === "Enter") $("#addQuoteBtn").click(); });
$("#quoteAuthorInput").addEventListener("keydown", function(e){ if (e.key === "Enter") $("#addQuoteBtn").click(); });

/* ---------- 设置弹窗 ---------- */
function openSettings(){
  $("#sFocus").value = settings.focus;
  $("#sShort").value = settings.short;
  $("#sLong").value = settings.long;
  $("#sCycles").value = settings.cycles;
  $("#sAuto").checked = settings.autoStart;
  $("#sSound").checked = settings.sound;
  $("#sNotify").checked = settings.notify;
  $("#bgUrlInput").value = bg.type === "url" ? bg.value : "";
  $("#sShowQuotes").checked = showQuotes;
  renderQuoteList();
  markPresetSel();
  modal.classList.add("open");
}
$("#settingsBtn").onclick = openSettings;
$("#closeBtn").onclick = function(){ modal.classList.remove("open"); };
modal.addEventListener("click", function(e){ if (e.target === modal) modal.classList.remove("open"); });
$("#testSoundBtn").onclick = function(){
  var keep = settings.sound;
  settings.sound = true;
  playChime();
  settings.sound = keep;
};
$("#saveBtn").onclick = function(){
  settings.focus = clamp(parseInt($("#sFocus").value, 10) || DEFAULT_SETTINGS.focus, 1, 180);
  settings.short = clamp(parseInt($("#sShort").value, 10) || DEFAULT_SETTINGS.short, 1, 60);
  settings.long = clamp(parseInt($("#sLong").value, 10) || DEFAULT_SETTINGS.long, 1, 60);
  settings.cycles = clamp(parseInt($("#sCycles").value, 10) || DEFAULT_SETTINGS.cycles, 2, 8);
  settings.autoStart = $("#sAuto").checked;
  settings.sound = $("#sSound").checked;
  settings.notify = $("#sNotify").checked;
  LS.set("pm_settings", settings);
  showQuotes = $("#sShowQuotes").checked;
  LS.set("pm_show_quotes", showQuotes);
  renderQuote();
  if (settings.notify && "Notification" in window && Notification.permission === "default"){
    Notification.requestPermission();
  }
  if (!running) remain = total();
  render();
  modal.classList.remove("open");
};

/* ---------- 控制与快捷键 ---------- */
startBtn.onclick = toggle;
$("#resetBtn").onclick = reset;
$("#skipBtn").onclick = skip;
$$(".tab").forEach(function(b){ b.addEventListener("click", function(){ switchMode(b.dataset.mode, false); }); });
document.addEventListener("keydown", function(e){
  var tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  if (e.code === "Space"){ e.preventDefault(); toggle(); }
  else if (e.key === "r" || e.key === "R"){ reset(); }
  else if (e.key === "1"){ switchMode("focus", false); }
  else if (e.key === "2"){ switchMode("short", false); }
  else if (e.key === "3"){ switchMode("long", false); }
});

/* ---------- 初始化 ---------- */
document.body.dataset.mode = mode;
applyTheme();
renderPresets();
applyBg();
renderTasks();
renderQuote();
render();
})();
</script>
